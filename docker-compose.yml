services:
  backend:
    build: ./backend
    environment:
      CARDBACK_SECRET: ${CARDBACK_SECRET:-change-me-in-production}
      DATABASE_URL: sqlite:////data/cardback.db
    volumes:
      - cardback-data:/data
    ports:
      - "8470:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3470:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cardback-data:
